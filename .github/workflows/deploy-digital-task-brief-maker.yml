name: Deploy AgencyThings Desktop

on:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare AgencyThings site
        run: |
          mkdir -p _site/tools
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R tools/digital-task-brief-maker _site/tools/digital-task-brief-maker
          touch _site/.nojekyll
          cat > _site/build-info.json <<EOF
          {"build":"agencythings-desktop","date":"2026-07-12","sha":"${GITHUB_SHA}"}
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## AgencyThings desktop is deployed

          Open the workspace:

          ${{ steps.deployment.outputs.page_url }}

          The Digital Task Brief Maker remains available at:

          ${{ steps.deployment.outputs.page_url }}tools/digital-task-brief-maker/
          SUMMARY
